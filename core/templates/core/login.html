{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}" type="text/css">
</head>

<body>
    <section class="vh-100" style="background-color: #2c2c2c;">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col col-xl-10">
                    <div class="card bg-dark" style="border-radius: 1rem; height: 100%;">
                        <div class="row g-0 h-100">
                            <!-- Columna con formulario -->
                            <div class="col-md-6 d-flex align-items-center">
                                <div class="card-body p-4 p-lg-5 text-black">
                                    <div class="d-flex align-items-center mb-3 pb-1">
                                        <span class="h1 fw-bold mb-0 text-light">Logo</span>
                                    </div>
    
                                    <form style="width: 23rem;">
                                        <h3 class="fw-normal mb-3 pb-3 text-danger" style="letter-spacing: 1px;">INICIA SESIÓN</h3>
    
                                        <!-- Input de correo con icono al lado derecho -->
                                        <div class="form-outline mb-4">
                                            <label class="form-label text-danger" for="form2Example18">Correo Electrónico</label>
                                            <div class="input-group">
                                                <input type="email" id="form2Example18" class="form-control form-control-lg" placeholder="Ingrese su correo" />
                                                <span class="input-group-text bg-dark text-danger">
                                                    <i class="bi bi-person-circle"></i>
                                                </span>
                                            </div>
                                        </div>
    
                                        <div class="form-outline mb-4">
                                            <label class="form-label text-danger" for="form2Example28">Contraseña</label>
                                            <div class="input-group">
                                                <input type="password" id="form2Example28" class="form-control form-control-lg" placeholder="Ingrese su contraseña" />
                                                <span class="input-group-text bg-dark text-danger" id="togglePassword" style="cursor: pointer;">
                                                    <i class="bi bi-eye-fill"></i>
                                                </span>
                                            </div>   
                                            <label for="recordar" class="recordar py-3 text-light">
                                                <input type="checkbox" id="recordar"> Recordar
                                            </label>                                         
                                        </div>
    
                                        <p class="small mb-5 pb-lg-2"><a class="text-danger" href="#!">¿Has olvidado tu
                                            contraseña?</a></p>
    
                                        <div class="pt-1 mb-4 text-center">
                                            <button data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-danger btn-lg btn-block" type="button">
                                                <span>Iniciar Sesión</span>
                                            </button>
                                        </div>
    
                                        <p>¿No tienes una cuenta? <a href="{% url 'registro' %}" class="link-danger">Regístrate aquí</a></p>
                                    </form>
                                </div>
                            </div>
                            <!-- Columna con imagen -->
                            <div class="col-sm-9 col-md-12 col-lg-6 d-none d-md-block d-flex align-items-center justify-content-center" style="overflow: hidden;">
                                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/img3.webp" alt="Login image" class="img-fluid" style="border-radius: 0 1rem 1rem 0; width: 690px; height: 650px; object-fit: cover;" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script src="{% static 'core/js/vercontraseña.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
