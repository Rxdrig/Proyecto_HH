{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="{% static 'core/css/bootstrap.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'core/css/font-awesome.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'core/css/elegant-icons.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'core/css/owl.carousel.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'core/css/barfiller.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'core/css/magnific-popup.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'core/css/slicknav.min.css' %}" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <!-- Section: Design Block -->
    <section class="vh-200" style="background-color: #2c2c2c;">
        <!-- Jumbotron -->
        <div class="px-4 py-5 text-center text-lg-start">
            <div class="container py-5 h-200">
                <div class="row gx-lg-5 align-items-center">
                    <div class="col-lg-6 col-md-12 mb-4 mb-lg-0">
                        <h1 class="my-5 display-4 fw-bold text-danger">
                            ¡Comienza tu aventura con nosotros! <br />
                            <span class="text-secondary">Donde los mejores consejos te esperan</span>
                        </h1>
                        <p class="text-light">
                            Conviértete en miembro de nuestra comunidad y accede a contenido único que te ayudará a mejorar tus habilidades.
                        </p>
                    </div>

                    <div class="col-lg-6 col-md-12">
                        <div class="card" style="background-color: rgba(88, 87, 87, 0.34);">
                            <div class="card-body p-5">
                                <form>
                                    <!-- 2 column grid layout with text inputs for the first and last names -->
                                    <div class="row">
                                        <div class="col-md-6 mb-4">
                                            <div class="form-outline">
                                                <label class="form-label text-danger" for="form3Example1">Nombre(s)</label>
                                                <div class="input-group">
                                                    <span class="input-group-text bg-dark text-danger">
                                                        <i class="bi bi-person-square"></i>
                                                    </span>
                                                    <input type="text" id="form3Example1" class="form-control" placeholder="Ingrese su nombre" />
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-4">
                                            <div class="form-outline">
                                                <label class="form-label text-danger" for="form3Example2">Apellido(s)</label>
                                                <div class="input-group">
                                                    <span class="input-group-text bg-dark text-danger">
                                                        <i class="bi bi-person-square"></i>
                                                    </span>
                                                    <input type="text" id="form3Example2" class="form-control" placeholder="Ingrese su apellido"/>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Email input -->
                                    <div class="form-outline mb-4">
                                        <label class="form-label text-danger" for="form3Example3">Correo Electrónico</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-dark text-danger">
                                                <i class="bi bi-envelope-at"></i>
                                            </span>
                                            <input type="email" id="form3Example3" class="form-control" placeholder="Ingrese su correo"/>
                                        </div>
                                    </div>

                                    <!-- Nombre de usuario -->
                                    <div class="form-outline mb-4">
                                        <label class="form-label text-danger" for="form3Example4">Nombre de Usuario</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-dark text-danger">
                                                <i class="bi bi-file-earmark-person"></i>
                                            </span>
                                            <input type="text" id="form3Example4" class="form-control"  placeholder="Ingrese su nombre de usuario"/>
                                        </div>
                                    </div>

                                    <!-- Password input -->
                                    <div class="form-outline mb-4">
                                        <label class="form-label text-danger" for="form3Example5">Contraseña</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-dark text-danger">
                                                <i class="bi bi-person-lock"></i>
                                            </span>
                                            <input type="password" id="form3Example5" class="form-control" placeholder="Ingrese su contraseña"/>
                                        </div>
                                    </div>

                                    <div class="form-outline mb-4">
                                        <label class="form-label text-danger" for="form3Example5">Repita la Contraseña</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-dark text-danger">
                                                <i class="bi bi-person-lock"></i>
                                            </span>
                                            <input type="password" id="form3Example5" class="form-control" placeholder="Ingrese su contraseña nuevamente"/>
                                        </div>
                                    </div>

                                    <!-- Checkbox -->
                                    <div class="form-check d-flex justify-content-center mb-4">
                                        <label for="form2Example33" class="form-check-label py-3 text-light">Suscríbete para recibir notificaciones sobre las últimas noticias.
                                            <input class="form-check-label" type="checkbox" id="form2Example33"> 
                                        </label> 
                                    </div>

                                    <!-- Submit button -->
                                    <button type="submit" class="btn btn-outline-danger btn-block mb-2" >
                                        Registrarse
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Jumbotron -->
    </section>
    <!-- Section: Design Block -->



    <script src="{% static 'core/js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'core/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'core/js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'core/js/circle-progress.min.js' %}"></script>
    <script src="{% static 'core/js/jquery.barfiller.js' %}"></script>
    <script src="{% static 'core/js/jquery.slicknav.js' %}"></script>
    <script src="{% static 'core/js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'core/js/main.js' %}"></script>
</body>

</html>
